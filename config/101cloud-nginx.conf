server {
    listen 443 ssl;
    server_name cloud.brill.gay;

    ssl_certificate /etc/nginx/ssl/brill.gay/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/brill.gay/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    access_log /var/log/nginx/101cloud-access.log;
    error_log /var/log/nginx/101cloud-error.log;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Go serves the SPA, static assets and API, including WebSocket consoles.
    # Preserve its Cache-Control and error responses; no root or try_files.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
    }
}