# Install as /etc/nginx/conf.d/101cloud.conf (included from the http context).
# Requires the backend binary with embedded frontend assets.
# Backend settings:
#   CLOUD_LISTEN=127.0.0.1:8080
#   CLOUD_ORIGIN=https://192.168.0.111
#   CLOUD_TRUSTED_PROXIES=127.0.0.1/32,::1/128
# Replace the existing site configuration; do not load both copies.

map $http_upgrade $cloud101_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name 192.168.0.111;

    ssl_certificate /etc/101cloud/tls.crt;
    ssl_certificate_key /etc/101cloud/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    access_log /var/log/nginx/101cloud-access.log;
    error_log /var/log/nginx/101cloud-error.log;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Go serves the SPA, static assets and API, including WebSocket consoles.
    # Preserve its Cache-Control and error responses; no root or try_files.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cloud101_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
    }
}
